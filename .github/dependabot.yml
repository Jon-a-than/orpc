version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'build'
      include: scope
    groups:
      routine-updates:
        patterns: ['*']
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'build'
      include: scope
    groups:
      routine-updates:
        patterns: ['*']
        update-types: ['minor', 'patch']
