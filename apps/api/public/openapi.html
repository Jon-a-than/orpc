<!doctype html>
<html lang="en">
  <head>
    <title>OpenAPI 3.2.0</title>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="https://orpc.dev/icon.svg" rel="icon" type="image/svg+xml" />
  </head>

  <body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
    Scalar.createApiReference('#app', {
      authentication: {
        securitySchemes: {
          bearerAuth: {
            token: 'default-token'
          }
        }
      },
      showOperationId: true,
      sources: [
        { title: 'API', url: './spec.json' },
        { title: 'Auth', url: './auth-spec.json' }
      ],
      theme: 'alternate'
    })
    </script>
  </body>
</html>
